program: ../src/multiplication.py
method: bayes
name: Multiplication architecture
metric:
  name: val_loss.min
  goal: minimize
parameters:
  activation:
    values: relu
    distribution: constant
  batch_size:
    values: 1000
    distribution: constant
  max_epochs:
    value: 5000
    distribution: constant
  layer:
    min: 1
    max: 10
    distribution: int_uniform
  lr:
    min: -6
    max: -3
    distribution: int_uniform
  unit:
    values: [2, 4, 8, 16, 32, 64, 128]
    distribution: categorical
